<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ledgerline — daily stock signals for US &amp; NSE, on the record</title>
<meta name="description" content="Daily rule-based buy, exit and sell signals for every liquid US and NSE stock, with an open method and a public, uneditable signal log.">
<link rel="icon" type="image/svg+xml" href="logo.svg">
<meta property="og:title" content="Ledgerline">
<meta property="og:type" content="website">
<meta property="og:url" content="https://chndr-prksh.github.io/ledgerline/">
<meta property="og:image" content="https://chndr-prksh.github.io/ledgerline/social.png">
<meta property="og:image:width" content="1280">
<meta property="og:image:height" content="640">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://chndr-prksh.github.io/ledgerline/social.png">
<meta property="og:description" content="Daily buy, exit and sell signals for US and NSE stocks, with an open method and a public signal log.">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <a class="brand" href="#/"><img src="logo.svg" alt="" width="26" height="26">Ledgerline</a>
  <div class="seg" id="market-switch" role="group" aria-label="Market">
    <button data-market="us">US</button><button data-market="nse">NSE</button>
  </div>
  <nav id="nav">
    <a data-view="overview">Today</a>
    <a data-view="screener">Screener</a>
    <a data-view="list">My list</a>
    <a data-view="record">Track record</a>
    <a data-view="method">Method</a>
  </nav>
  <form id="jump" autocomplete="off"><input id="jump-input" type="search" placeholder="Find a stock…" aria-label="Find a stock"><div id="jump-results" hidden></div></form>
</header>
<main id="app"><p class="muted pad">Loading…</p></main>
<footer class="foot">
  Rule-based signals from end-of-day prices, for research and education. Not investment advice, and not a
  recommendation to buy or sell anything. Data can be late or wrong; check prices with your broker.
  <a href="https://github.com/chndr-prksh/ledgerline">Source on GitHub</a>
</footer>
<script src="charts.js"></script>
<script src="app.js"></script>
</body>
</html>
