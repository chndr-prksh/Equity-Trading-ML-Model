name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest -q

  # Proves the free data sources answer from a GitHub runner, on a slice of each market.
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m tracker.run --market nse --market us --limit 400 --out public --ledger /tmp/ledger
      - run: |
          python - <<'PY'
          import json
          for m in ("nse", "us"):
              s = json.load(open(f"public/data/{m}/summary.json"))
              print(m, s["asof"], s["sources"], s["counts"], s["adjustments"]["audit"])
          PY
